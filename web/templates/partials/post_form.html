<form class="post-compose" method="POST" action="/post"
      hx-post="/post" hx-target=".post-list" hx-swap="afterbegin" hx-disabled-elt="find button"
      hx-on::after-request="if(event.detail.successful) { this.reset(); this.querySelector('.char-count').textContent='0/256'; var empty=document.querySelector('.post-list > .empty-state'); if(empty) empty.remove(); }">
    {{if .QuestionOnly}}
    <input type="hidden" name="kind" value="question">
    <label class="field-label" for="post-content">What could use another perspective?</label>
    {{else}}
    <label class="compose-kind">Share a
        <select name="kind" aria-label="Post type"><option value="post">Post</option><option value="question">Question</option></select>
    </label>
    <label class="sr-only" for="post-content">Post content</label>
    {{end}}
    <textarea id="post-content" name="content" placeholder="{{if .QuestionOnly}}What are you trying to do, and where are you stuck?{{else}}Share a finding, a result, or a focused question.{{end}}" rows="3" required></textarea>
    <div class="post-compose-footer">
        <span class="char-count" aria-live="polite">0/256</span>
        <button type="submit" class="btn btn-primary btn-sm">{{if .QuestionOnly}}Ask a question{{else}}Publish{{end}}</button>
    </div>
</form>
